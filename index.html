<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>四级抽词器</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #f5f5f5; color: #1a1a1a; padding: 16px;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #161616; color: #eee; }
    .bar button, .num { background: #2a2a2a; color: #eee; border-color: #444; }
    .card { background: #1f1f1f; border-color: #333; }
    .meaning { border-top-color: #333; }
  }
  .app { width: 100%; max-width: 560px; }
  .bar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .bar button {
    font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 10px;
    border: 1px solid #d0d0d0; background: #fff; cursor: pointer;
  }
  .bar button:hover { filter: brightness(0.95); }
  .num {
    font: inherit; font-size: 14px; width: 68px; padding: 8px 6px; text-align: center;
    border-radius: 10px; border: 1px solid #d0d0d0; background: #fff;
  }
  .batchlabel { font-size: 14px; opacity: .7; }
  #btnReset { margin-left: auto; } #btnReset, #btnRestore { opacity: .6; }
  .deckinfo { font-size: 13px; opacity: .6; width: 100%; }
  .card {
    background: #fff; border: 1px solid #e0e0e0; border-radius: 16px;
    padding: 48px 24px; text-align: center; cursor: pointer; user-select: none;
    min-height: 260px; display: flex; flex-direction: column; justify-content: center; gap: 16px;
  }
  .progress { font-size: 14px; opacity: .55; margin-bottom: 12px; text-align: center; }
  .word { font-size: 40px; font-weight: 600; letter-spacing: .5px; }
  .meaning { font-size: 18px; line-height: 1.6; border-top: 1px dashed #ccc; padding-top: 16px; }
  .flag {
    font: inherit; font-size: 14px; padding: 8px 16px; border-radius: 999px; cursor: pointer;
    border: 1px solid #d0d0d0; background: #fff; align-self: center;
  }
  .flag.on { background: #c0392b; border-color: #c0392b; color: #fff; }
  .hidden { visibility: hidden; }
  .hint { text-align: center; font-size: 13px; opacity: .45; margin-top: 12px; }
  .done { font-size: 22px; font-weight: 600; }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <button id="btnImport">导入词表文档</button>
    <span class="batchlabel">每轮抽</span>
    <input class="num" id="num" type="number" min="1" max="999" value="45">
    <span class="batchlabel">个</span>
    <button id="btnDraw">开始</button>
    <button id="btnRestore">恢复内置词库</button>
    <button id="btnReset">重置学习记录</button>
    <span class="deckinfo" id="deckinfo"></span>
  </div>
  <div class="progress" id="progress"></div>
  <div class="card" id="card">
    <div class="word" id="word"></div>
    <div class="meaning hidden" id="meaning"></div>
    <button class="flag hidden" id="flag">标为没学会，下次还会抽到</button>
    <div class="done hidden" id="done"></div>
  </div>
  <div class="hint">按空格键 或 点击卡片：显示答案 → 下一个（默认记住，不再出现）</div>
</div>
<input type="file" id="file" accept=".tsv,.txt,.md" style="display:none">

var LKEY = 'cet4_learned_v1';
var BKEY = 'cet4_batch_v1';
var DKEY = 'cet4_deck_v1';
var store = {
  get: function(k, d){ try { var v = localStorage.getItem(k); return v === null ? d : v; } catch(e) { return d; } },
  set: function(k, v){ try { localStorage.setItem(k, v); } catch(e) {} }
};
var learned = new Set(JSON.parse(store.get(LKEY, '[]') || '[]'));
var batch = parseInt(store.get(BKEY, '45'), 10) || 45;
var savedDeck = JSON.parse(store.get(DKEY, '[]') || '[]');
var deck = savedDeck.length ? savedDeck : DEFAULT_DECK.slice();
var customDeck = savedDeck.length > 0;
var quiz = [], idx = 0, phase = 'q', flagged = false;
var $ = function(id){ return document.getElementById(id); };

function getBatch() {
  var n = parseInt($('num').value, 10);
  if (isNaN(n) || n < 1) n = 1;
  if (n > 999) n = 999;
  $('num').value = n;
  return n;
}
function parseFile(text, name) {
  var out = [];
  if (/\.md$/i.test(name)) {
    var re = /-\s*\*\*(.+?)\*\*\s+(.+)/;
    text.split(/\r?\n/).forEach(function(l){ var m = l.match(re); if (m) out.push({w:m[1].trim(), m:m[2].trim()}); });
  } else {
    text.split(/\r?\n/).forEach(function(l){
      var t = l.trim(); if (!t) return;
      if (t.indexOf('\t') > -1) { var p = t.split('\t'); out.push({w:p[0].trim(), m:(p[1]||'').trim()}); }
      else { var sp = t.indexOf(' '); if (sp > 0) out.push({w:t.slice(0,sp), m:t.slice(sp+1).trim()}); }
    });
  }
  return out.filter(function(x){ return x.w; });
}
function draw() {
  batch = getBatch(); store.set(BKEY, String(batch));
  var pool = deck.filter(function(d){ return !learned.has(d.w); });
  for (var i = pool.length - 1; i > 0; i--) { var j = Math.floor(Math.random()*(i+1)); var t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
  quiz = pool.slice(0, Math.min(batch, pool.length)); idx = 0; phase = quiz.length ? 'q' : 'done'; flagged = false; render();
}
function render() {
  $('deckinfo').textContent = '词库 ' + deck.length + ' 词（' + (customDeck ? '导入' : '内置') + '）· 已掌握 ' + learned.size + ' · 每轮 ' + batch + ' 个';
  if (phase === 'done') {
    $('progress').textContent = '';
    $('word').textContent = ''; $('meaning').classList.add('hidden'); $('flag').classList.add('hidden');
    $('done').classList.remove('hidden');
    $('done').textContent = quiz.length === 0
      ? '没有可抽的词了：要么全部掌握，要么先导入词表'
      : '本轮完成，点上方「开始」再来一轮';
    return;
  }
  $('done').classList.add('hidden');
  $('progress').textContent = '第 ' + (idx+1) + ' / ' + quiz.length + ' 个';
  $('word').textContent = quiz[idx].w;
  $('meaning').textContent = quiz[idx].m;
  $('meaning').classList.toggle('hidden', phase === 'q');
  $('flag').classList.toggle('hidden', phase === 'q');
  $('flag').classList.toggle('on', flagged);
  $('flag').textContent = flagged ? '已标记：下次还会抽到' : '标为没学会，下次还会抽到';
}
function tap() {
  if (phase === 'q') { phase = 'a'; render(); return; }
  if (phase === 'a') {
    var w = quiz[idx].w;
    if (flagged) { learned.delete(w); } else { learned.add(w); }
    store.set(LKEY, JSON.stringify(Array.from(learned)));
    idx++; flagged = false;
    phase = idx >= quiz.length ? 'done' : 'q';
    render();
  }
}
$('num').value = batch;
$('card').addEventListener('click', function(e){ if (e.target.id !== 'flag' && e.target.id !== 'num') tap(); });
$('flag').addEventListener('click', function(){ if (phase === 'a') { flagged = !flagged; render(); } });
document.addEventListener('keydown', function(e){
  if (e.target && e.target.tagName === 'INPUT') return;
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); tap(); }
});
$('btnDraw').addEventListener('click', draw);
$('btnImport').addEventListener('click', function(){ $('file').click(); });
$('btnRestore').addEventListener('click', function(){
  if (confirm('放弃导入的词表，恢复内置 1232 词？学习记录保留。')) { store.set(DKEY, '[]'); customDeck = false; deck = DEFAULT_DECK.slice(); draw(); }
});
$('btnReset').addEventListener('click', function(){
  if (confirm('确定清空学习记录？所有词都会重新出现。')) { learned.clear(); store.set(LKEY, '[]'); draw(); }
});
$('file').addEventListener('change', function(e){
  var f = e.target.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function(){
    var parsed = parseFile(String(r.result), f.name);
    if (parsed.length) { deck = parsed; customDeck = true; store.set(DKEY, JSON.stringify(parsed)); draw(); }
    else alert('没能从文档里解析出词条。支持：TSV（单词+Tab+释义）、打印版 md、纯文本。');
  };
  r.readAsText(f);
  e.target.value = '';
});
draw();
</script>
